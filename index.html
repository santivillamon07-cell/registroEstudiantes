<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Estudiantes</title>
<style>
  :root {
    --bg: #14181f;
    --panel: #1c2129;
    --border: #2b3140;
    --text: #e7eaf0;
    --muted: #8b93a3;
    --accent: #4f8cff;
    --accent-hover: #3d78e6;
    --danger: #e05656;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 16px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 4px;
    letter-spacing: 0.2px;
  }
  p.subtitle {
    color: var(--muted);
    margin: 0 0 28px;
    font-size: 0.9rem;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 24px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input[type="text"] {
    width: 100%;
    padding: 9px 10px;
    background: #10141a;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 0.95rem;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
  }
  fieldset {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
  }
  legend {
    font-size: 0.8rem;
    color: var(--muted);
    padding: 0 4px;
  }
  .radio-row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .radio-row label { display: flex; align-items: center; gap: 6px; color: var(--text); margin: 0; font-size: 0.9rem; }
  .check-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .check-row label { margin: 0; color: var(--text); font-size: 0.9rem; }
  .actions {
    margin-top: 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  button {
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    font-size: 0.9rem;
    cursor: pointer;
    font-weight: 600;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-secondary:hover { border-color: var(--accent); }
  .btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
  .btn-danger:hover { background: rgba(224,86,86,0.1); }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
  }
  th, td {
    text-align: left;
    padding: 10px 8px;
    border-bottom: 1px solid var(--border);
  }
  th { color: var(--muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  .empty {
    color: var(--muted);
    text-align: center;
    padding: 24px 0;
    font-size: 0.9rem;
  }
  .badge {
    display: inline-block;
    background: rgba(79,140,255,0.15);
    color: var(--accent);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.75rem;
  }
  .count { color: var(--muted); font-size: 0.85rem; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Registro de Estudiantes</h1>
  <p class="subtitle">Los datos se guardan en este navegador. Usá "Descargar .txt" para exportar el archivo.</p>

  <div class="panel">
    <div class="grid">
      <div>
        <label for="carnet">Carnet</label>
        <input type="text" id="carnet" placeholder="Ej: 2024015678">
      </div>
      <div>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" placeholder="Ej: María">
      </div>
      <div>
        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" placeholder="Ej: Rodríguez">
      </div>
      <div>
        <label for="carrera">Carrera</label>
        <input type="text" id="carrera" placeholder="Ej: Ingeniería en Sistemas">
      </div>
      <div>
        <label for="curso">Curso</label>
        <input type="text" id="curso" placeholder="Ej: Programación II">
      </div>
      <div>
        <label>Modalidad</label>
        <fieldset>
          <legend>Elegí una</legend>
          <div class="radio-row">
            <label><input type="radio" name="modalidad" value="Diurno" checked> Diurno</label>
            <label><input type="radio" name="modalidad" value="Vespertino"> Vespertino</label>
            <label><input type="radio" name="modalidad" value="Nocturno"> Nocturno</label>
          </div>
        </fieldset>
      </div>
    </div>

    <div class="check-row">
      <input type="checkbox" id="beca">
      <label for="beca">Beca</label>
    </div>

    <div class="actions">
      <button class="btn-primary" onclick="guardarEstudiante()">Guardar</button>
      <button class="btn-secondary" onclick="descargarTxt()">Descargar .txt</button>
      <button class="btn-danger" onclick="borrarTodo()">Borrar todo</button>
    </div>
  </div>

  <div class="panel">
    <div class="count" id="contador">0 estudiantes registrados</div>
    <div id="tablaContenedor"></div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'registroEstudiantes';

  function cargarEstudiantes() {
    const data = localStorage.getItem(STORAGE_KEY);
    return data ? JSON.parse(data) : [];
  }

  function guardarLista(lista) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(lista));
  }

  function renderTabla() {
    const lista = cargarEstudiantes();
    const contenedor = document.getElementById('tablaContenedor');
    const contador = document.getElementById('contador');
    contador.textContent = `${lista.length} estudiante${lista.length === 1 ? '' : 's'} registrado${lista.length === 1 ? '' : 's'}`;

    if (lista.length === 0) {
      contenedor.innerHTML = '<div class="empty">Todavía no hay estudiantes registrados.</div>';
      return;
    }

    let html = '<table><thead><tr><th>Carnet</th><th>Nombre</th><th>Apellido</th><th>Carrera</th><th>Curso</th><th>Modalidad</th><th>Beca</th></tr></thead><tbody>';
    lista.forEach(e => {
      html += `<tr>
        <td>${escapeHtml(e.carnet)}</td>
        <td>${escapeHtml(e.nombre)}</td>
        <td>${escapeHtml(e.apellido)}</td>
        <td>${escapeHtml(e.carrera)}</td>
        <td>${escapeHtml(e.curso)}</td>
        <td>${escapeHtml(e.modalidad)}</td>
        <td>${e.beca === 'Sí' ? '<span class="badge">Sí</span>' : 'No'}</td>
      </tr>`;
    });
    html += '</tbody></table>';
    contenedor.innerHTML = html;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function guardarEstudiante() {
    const carnet = document.getElementById('carnet').value.trim();
    const nombre = document.getElementById('nombre').value.trim();
    const apellido = document.getElementById('apellido').value.trim();
    const carrera = document.getElementById('carrera').value.trim();
    const curso = document.getElementById('curso').value.trim();
    const modalidad = document.querySelector('input[name="modalidad"]:checked').value;
    const beca = document.getElementById('beca').checked ? 'Sí' : 'No';

    if (!carnet || !nombre) {
      alert('Carnet y Nombre son obligatorios.');
      return;
    }

    const lista = cargarEstudiantes();
    lista.push({ carnet, nombre, apellido, carrera, curso, modalidad, beca });
    guardarLista(lista);
    renderTabla();
    limpiarCampos();
  }

  function limpiarCampos() {
    document.getElementById('carnet').value = '';
    document.getElementById('nombre').value = '';
    document.getElementById('apellido').value = '';
    document.getElementById('carrera').value = '';
    document.getElementById('curso').value = '';
    document.querySelector('input[name="modalidad"][value="Diurno"]').checked = true;
    document.getElementById('beca').checked = false;
    document.getElementById('carnet').focus();
  }

  function descargarTxt() {
    const lista = cargarEstudiantes();
    let contenido = 'Carnet,Nombre,Apellido,Carrera,Curso,Modalidad,Beca\n';
    lista.forEach(e => {
      contenido += `${e.carnet},${e.nombre},${e.apellido},${e.carrera},${e.curso},${e.modalidad},${e.beca}\n`;
    });
    const blob = new Blob([contenido], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'estudiantes.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function borrarTodo() {
    if (confirm('¿Seguro que querés borrar todos los estudiantes registrados?')) {
      localStorage.removeItem(STORAGE_KEY);
      renderTabla();
    }
  }

  renderTabla();
</script>
</body>
</html>
